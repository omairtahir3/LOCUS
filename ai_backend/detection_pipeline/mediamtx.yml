# Avoid port 8000 conflict with FastAPI backend
# Enable the HTTP API.
api: yes
rtspAddress: :8554
rtpAddress: :8100
rtcpAddress: :8101

paths:
  # Allow all paths by default so dynamic user streams (live/[id]) work.
  # GoPro feed — no publish auth (Quik app can't send credentials)
  # Reading is open locally.
  all:
    # No auth needed for local reads
    # publishUser: ""
    # readUser: ""
